name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Lint (errors, unused code, likely bugs)
        run: uvx ruff check src tests ytstr.py --select E9,F,B,PLE

      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest
