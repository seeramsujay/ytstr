# CodeRabbit configuration file
# Ref: https://docs.coderabbit.ai/
language: "en-US"
tone_instructions: "Be extremely thorough, strict, and rigorous. Analyze the entire repository and pull request for architecture, logic bugs, performance, security loopholes, edge cases, and best practices."
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
chat:
  auto_reply: true
