<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2030" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10131e" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <!-- Sound Waves (Left & Center Background) -->
  <g opacity="0.35" filter="url(#neonGlow)">
    <path d="M 50 360 Q 150 280 250 360 T 450 360 T 650 360 T 850 360 T 1050 360 T 1150 360" fill="none" stroke="#00f5d4" stroke-width="2"/>
    <path d="M 50 375 Q 150 320 250 375 T 450 375 T 650 375 T 850 375 T 1050 375 T 1150 375" fill="none" stroke="#7b2cbf" stroke-width="2.5"/>
    <path d="M 50 390 Q 150 340 250 390 T 450 390 T 650 390 T 850 390 T 1050 390 T 1150 390" fill="none" stroke="#ff007f" stroke-width="1.8"/>
  </g>

  <!-- Floating Audio Visualizer Spectrum Bars (Top Right) -->
  <g opacity="0.75" transform="translate(920, 80)">
    <rect x="0" y="70" width="8" height="50" rx="4" fill="#00f5d4"/>
    <rect x="14" y="40" width="8" height="80" rx="4" fill="#00f5d4"/>
    <rect x="28" y="20" width="8" height="100" rx="4" fill="#00e1d9"/>
    <rect x="42" y="55" width="8" height="65" rx="4" fill="#38b6ff"/>
    <rect x="56" y="10" width="8" height="110" rx="4" fill="#7b2cbf"/>
    <rect x="70" y="30" width="8" height="90" rx="4" fill="#9d4edd"/>
    <rect x="84" y="60" width="8" height="60" rx="4" fill="#c77dff"/>
    <rect x="98" y="15" width="8" height="105" rx="4" fill="#ff007f"/>
    <rect x="112" y="45" width="8" height="75" rx="4" fill="#ff007f"/>
    <rect x="126" y="80" width="8" height="40" rx="4" fill="#ff5400"/>
  </g>

  <!-- Left Side: Branding & Typography -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#1b2234" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4.5" fill="#00f5d4"/>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#00f5d4" letter-spacing="1">ULTRA-LOW RAM</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Roboto, sans-serif" font-size="88" font-weight="900" fill="url(#accentGrad)" letter-spacing="-2" filter="url(#neonGlow)">ytstr</text>

    <!-- Subtitle -->
    <text x="2" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600" fill="#ffffff" opacity="0.95">High-Speed YouTube Music CLI &amp; Interactive TUI Streamer</text>

    <!-- Feature Badges Row -->
    <g transform="translate(2, 185)">
      <!-- Badge 1: Peak RAM -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#161b26" stroke="#252e42"/>
      <text x="65" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a0aec0">⚡ &lt; 30MB RAM</text>

      <!-- Badge 2: Auto-DJ -->
      <rect x="140" y="0" width="145" height="32" rx="8" fill="#161b26" stroke="#252e42"/>
      <text x="212" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a0aec0">🎛️ Auto-DJ Engine</text>

      <!-- Badge 3: MPV -->
      <rect x="295" y="0" width="125" height="32" rx="8" fill="#161b26" stroke="#252e42"/>
      <text x="357" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a0aec0">🚀 Direct MPV</text>

      <!-- Badge 4: TUI -->
      <rect x="430" y="0" width="140" height="32" rx="8" fill="#161b26" stroke="#252e42"/>
      <text x="500" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a0aec0">📻 Radio Queue</text>
    </g>

    <!-- Quick Run Terminal Box -->
    <g transform="translate(2, 240)">
      <rect x="0" y="0" width="460" height="42" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
      <text x="16" y="26" font-family="'JetBrains Mono', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#00f5d4" font-weight="bold">$</text>
      <text x="32" y="26" font-family="'JetBrains Mono', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#c9d1d9">curl -fsSL https://git.new/ytstr | bash</text>
    </g>
  </g>

  <!-- Right Side Mock Terminal Window -->
  <g transform="translate(680, 110)">
    <!-- Terminal Shadow / Glow -->
    <rect x="0" y="0" width="450" height="280" rx="12" fill="url(#cardGrad)" stroke="#2d3748" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="450" height="34" rx="12" fill="#151923"/>
    <path d="M 0 24 L 0 34 L 450 34 L 450 24 Z" fill="#151923"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="17" r="5" fill="#27c93f"/>
    <text x="225" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#718096">ytstr — Terminal UI (curses)</text>

    <!-- Terminal Code Mockup -->
    <g transform="translate(20, 52)" font-family="'JetBrains Mono', Menlo, monospace" font-size="12">
      <!-- Tabs -->
      <text x="0" y="14" fill="#00f5d4" font-weight="bold">[Recommended]  My Playlists  Queue</text>
      <line x1="0" y1="24" x2="410" y2="24" stroke="#2d3748" stroke-width="1"/>

      <!-- Song List Items -->
      <text x="0" y="48" fill="#ffffff" opacity="0.6">   Queen - Bohemian Rhapsody (5:55)</text>
      <text x="0" y="70" fill="#00f5d4" font-weight="bold"> ▶ Daft Punk - Get Lucky (4:08) [Playing]</text>
      <text x="0" y="92" fill="#a0aec0">   Pink Floyd - Comfortably Numb (6:24)</text>
      <text x="0" y="114" fill="#a0aec0">   The Weeknd - Blinding Lights (3:20)</text>

      <!-- Status Bar Divider -->
      <line x1="0" y1="140" x2="410" y2="140" stroke="#2d3748" stroke-width="1"/>

      <!-- Playing Bar -->
      <text x="0" y="162" fill="#27c93f" font-weight="bold">▶ Get Lucky [======>---------] 01:42/04:08</text>
      <text x="0" y="184" fill="#718096" font-size="11">⏭ Next: Pink Floyd - Comfortably Numb</text>

      <!-- Controls Footer -->
      <rect x="-10" y="198" width="430" height="24" rx="4" fill="#1f2737"/>
      <text x="0" y="214" fill="#00f5d4" font-size="10.5">[Enter] Play  [←/→] Seek  [Space] Pause  [&gt;/&lt;] Skip</text>
    </g>
  </g>
</svg>
